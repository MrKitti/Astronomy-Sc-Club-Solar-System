<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบสุริยะ AR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--ink:#ece6d6;--sun:#ffb347;--line:rgba(236,230,214,.28);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
#cam,#c{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;display:none}
#c{touch-action:none}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent 30%,rgba(5,6,10,.92))}
h1{font-size:2.1rem;margin:0;font-weight:600;color:var(--sun);line-height:1.15}
p{margin:0 0 10px;max-width:34ch;line-height:1.55}
button{font:inherit;color:var(--ink);background:rgba(5,6,10,.55);border:1px solid var(--line);border-radius:999px;padding:13px 20px;text-align:left}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
button b{color:var(--sun);font-weight:600}
#hud{position:fixed;left:0;right:0;bottom:0;display:none;align-items:flex-end;justify-content:space-between;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#hud button{width:64px;height:64px;padding:0;text-align:center;font-size:1.4rem;border-radius:50%;touch-action:none}
#nm{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;display:none;font-weight:600;text-shadow:0 1px 8px #000}
#st{font-size:.85rem;opacity:.75;min-height:1.2em}
</style></head><body>

let mode=null,gyro=false,yaw=0,pitch=0,mv=0,ang=[0,0,0],last=0;
const eu=new V.Euler(),q1=new V.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),zee=new V.Vector3(0,0,1),wp=new V.Vector3(),fd=new V.Vector3();
addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gyro=true;ang=[e.alpha,e.beta,e.gamma]});
let dr=null;$('c').addEventListener('pointerdown',e=>dr=[e.clientX,e.clientY]);
addEventListener('pointerup',()=>dr=null);
$('c').addEventListener('pointermove',e=>{if(!dr||gyro)return;yaw-=(e.clientX-dr[0])*.005;pitch=Math.max(-1.4,Math.min(1.4,pitch-(e.clientY-dr[1])*.005));dr=[e.clientX,e.clientY]});
[['fw',1],['bk',-1]].forEach(([i,d])=>{const b=$(i);b.addEventListener('pointerdown',e=>{mv=d;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>mv=0))});
const st=t=>$('st').textContent=t;
function ui(on){$('menu').style.display=on?'flex':'none';$('hud').style.display=on?'none':(mode==='ar'?'none':'flex');$('nm').style.display=on?'none':'block'}
async function go(m){
 st('');mode=m;
 try{
  if(m!=='ar'&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}
  if(m==='cam'){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('cam').srcObject=s;$('cam').style.display='block';await $('cam').play()}
  if(m==='ar'){const s=await navigator.xr.requestSession('immersive-ar',{optionalFeatures:['local-floor']});R.xr.enabled=true;R.xr.setReferenceSpaceType('local');await R.xr.setSession(s);
   s.addEventListener('end',()=>{R.xr.enabled=false;mode=null;ui(true)})}
 }catch(e){mode=null;st('เปิดไม่ได้: '+(e.message||e.name));return}
 stars.visible=m==='sp';document.body.style.background=m==='sp'?'#05060a':'transparent';
 C.position.set(0,m==='sp'?1.1:0,m==='sp'?1.4:0);yaw=0;pitch=m==='sp'?-.3:0;ui(false);
}
$('bar').onclick=()=>go('ar');$('bcam').onclick=()=>go('cam');$('bsp').onclick=()=>go('sp');
if(navigator.xr&&navigator.xr.isSessionSupported)navigator.xr.isSessionSupported('immersive-ar').then(ok=>{$('bar').disabled=!ok;if(!ok)st('AR เดินได้จริง ต้องใช้ Android Chrome; โหมดอื่นใช้ได้ทุกเครื่อง')}).catch(()=>{$('bar').disabled=true});
else{$('bar').disabled=true;st('เครื่องนี้ไม่รองรับ AR แบบเดินได้ ลองโหมดกล้องหรือท่องอวกาศ')}
R.setAnimationLoop(t=>{
 const dt=Math.min((t-last)/1000,.1);last=t;
 orb.forEach(p=>{p.rotation.y+=p.userData.w*dt;if(p.userData.moon)p.userData.moon.rotation.y+=dt*1.5});spin.forEach(m=>m.rotation.y+=dt*.4);
 if(mode&&mode!=='ar'){
  if(gyro){const o=(screen.orientation&&screen.orientation.angle||0)*.01745;eu.set(ang[1]*.01745,ang[0]*.01745,-ang[2]*.01745,'YXZ');C.quaternion.setFromEuler(eu).multiply(q1).multiply(new V.Quaternion().setFromAxisAngle(zee,-o))}
  else C.rotation.set(pitch,yaw,0,'YXZ');
  if(mv){C.getWorldDirection(fd);C.position.addScaledVector(fd,mv*dt*1.3)}
 }
 if(mode){let b=1e9,n='';orb.forEach(p=>{p.userData.g.getWorldPosition(wp);const d=wp.distanceTo(C.getWorldPosition(fd));if(d<b){b=d;n=p.userData.th}});$('nm').textContent=n}
 R.render(S,C)});
</script></body></html>
